; Instellingen voor servers waar php als fpm of cgi draait.
; Dat is tegenwoordig het vaakst het geval.
;
; Deze regels staan aan. Wil je ze uitzetten, zet er dan weer een
; puntkomma voor.
; Zet post_max_size altijd wat hoger dan upload_max_filesize.
;
; Let op: een wijziging hier kan tot vijf minuten duren voor de server
; hem oppikt. Zie ook LEES-MIJ.md.

upload_max_filesize = 200M
post_max_size = 220M
max_execution_time = 600
max_input_time = 600
